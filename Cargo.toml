[package]
name = "clipper2c-sys"
version = "0.1.6"
authors = ["Fredrik Söderström <tirithen@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tirithen/clipper2c-sys"
documentation = "https://docs.rs/clipper2c-sys/"
description = "Rust FFI bindings to Clipper2 — polygon clipping, offsetting (inflate/deflate), Minkowski sum, and polyline simplification."
keywords = ["polygon", "clipping", "offset", "clipper", "clipper2"]
categories = ["algorithms", "external-ffi-bindings", "graphics", "science::geo"]

[features]
generate-bindings = ["bindgen"]
update-bindings = ["generate-bindings"]
serde = ["dep:serde"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = "1.2.61"

[[bench]]
name = "ffi_bench"
harness = false
